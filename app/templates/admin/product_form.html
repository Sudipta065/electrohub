{% extends "base.html" %}{% block title %}Add product | ElectroHub{% endblock %}
{% block content %}<section class="auth-section"><form class="form-card wide" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Administration</p><h1>Add product</h1><div class="two-col"><label>SKU<input name="sku" required></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.category_id }}">{{ c.name }}</option>{% endfor %}</select></label></div><label>Product name<input name="name" required></label><div class="two-col"><label>Brand<input name="brand"></label><label>Price<input type="number" name="price" min="0.01" step="0.01" required></label></div><label>Starting stock<input type="number" name="stock" min="0" value="0" required></label><label>Image URL<input type="url" name="image_url"></label><label>Description<textarea name="description" rows="4"></textarea></label><button class="button full">Create product</button></form></section>{% endblock %}
