{% extends "base.html" %}{% block title %}Checkout | ElectroHub{% endblock %}
{% block content %}<section class="page-header"><div class="container"><p class="eyebrow">Final step</p><h1>Secure checkout</h1></div></section><section class="section container narrow"><form class="form-card wide" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Delivery details</h2><label>Full delivery address<textarea name="address" rows="4" minlength="10" required placeholder="Street, suburb, state and postcode"></textarea></label><h2>Payment method</h2><label class="radio"><input type="radio" name="payment_method" value="CARD_DEMO" required> Demo card payment <small>No real card information is collected.</small></label><label class="radio"><input type="radio" name="payment_method" value="PAY_ON_DELIVERY"> Pay on delivery</label><div class="checkout-total"><span>Order total</span><strong>${{ '%.2f'|format(cart.total) }}</strong></div><button class="button full" {% if not cart.items %}disabled{% endif %}>Place order</button></form></section>{% endblock %}
