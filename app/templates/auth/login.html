{% extends "base.html" %}{% block title %}Log in | ElectroHub{% endblock %}
{% block content %}<section class="auth-section"><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Welcome back</p><h1>Log in</h1><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><label class="check"><input type="checkbox" name="remember"> Remember me</label><button class="button full">Log in</button><p>New customer? <a href="{{ url_for('auth.register') }}">Create an account</a></p></form></section>{% endblock %}
