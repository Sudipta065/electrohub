{% extends "base.html" %}{% block title %}Create account | ElectroHub{% endblock %}
{% block content %}<section class="auth-section"><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Join ElectroHub</p><h1>Create account</h1><div class="two-col"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label></div><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Phone (optional)<input type="tel" name="phone"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>At least 8 characters</small></label><button class="button full">Create account</button><p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></form></section>{% endblock %}
